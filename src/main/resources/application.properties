# ===================================================================
# Application Core Configuration
# ===================================================================
spring.application.name=library-management-system
server.port=8080

# ===================================================================
# Spring Boot Actuator Configuration
# ===================================================================
# Expose health, info, and metrics endpoints via /actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.base-path=/actuator

# Health Endpoint Configuration
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true

# Info Endpoint Configuration
management.endpoint.info.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Application Metadata exposed via /actuator/info
info.app.name=Library Management System
info.app.description=Library Management System REST API (DevOps / SRE Monitoring Enabled)
info.app.version=0.0.1-SNAPSHOT
info.app.environment=${ENVIRONMENT:dev}

# Metrics & Prometheus Configuration
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Common Tags for Metrics (useful for Prometheus & CloudWatch Metrics Dimensions)
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${ENVIRONMENT:dev}

# ===================================================================
# Logging Configuration
# ===================================================================
logging.config=classpath:logback-spring.xml
logging.level.root=INFO
logging.level.com.rit.library=DEBUG
logging.level.org.springframework.boot.actuate=INFO
logging.level.org.springframework.web=INFO

